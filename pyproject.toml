[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "lang-rag-assistant"
version = "0.1.0"
description = "Document Q&A chatbot built on LangChain and Deep Agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.35",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "langchain[google-genai,groq,openai]>=1.4.10",
    "pypdf>=7.0.1",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
