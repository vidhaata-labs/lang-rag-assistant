[theme]
base = "light"
primaryColor = "#B45309"
backgroundColor = "#F4EFE6"
secondaryBackgroundColor = "#FBF8F2"
textColor = "#1F1B16"
borderColor = "#D9D0C1"
linkColor = "#B45309"
font = "Source Sans 3:https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
headingFontSizes = ["28px", "20px", "16px", "16px", "14px", "14px"]
headingFontWeights = [400, 400, 600, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "4px"
showWidgetBorder = true
paddingTop = "24px"
paddingBottom = "24px"

[theme.sidebar]
backgroundColor = "#F4EFE6"
secondaryBackgroundColor = "#FBF8F2"
textColor = "#1F1B16"
borderColor = "#D9D0C1"
primaryColor = "#B45309"
linkColor = "#B45309"

[client]
toolbarMode = "minimal"
